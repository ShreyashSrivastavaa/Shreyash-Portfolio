<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="flame-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="ambient-glow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FFD98A" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FF9F1C" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#E8590C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0B1030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame-outer" x1="250" y1="60" x2="250" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFEFB8"/>
      <stop offset="35%" stop-color="#FFC857"/>
      <stop offset="75%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#E8590C"/>
    </linearGradient>
    <linearGradient id="flame-inner" x1="250" y1="110" x2="250" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
    <linearGradient id="clay-base" x1="250" y1="225" x2="250" y2="425" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DE7952"/>
      <stop offset="40%" stop-color="#C85A32"/>
      <stop offset="70%" stop-color="#9C3D1A"/>
      <stop offset="100%" stop-color="#501C0A"/>
    </linearGradient>
    <linearGradient id="clay-rim" x1="100" y1="260" x2="400" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DE7952"/>
      <stop offset="50%" stop-color="#FFB088"/>
      <stop offset="100%" stop-color="#B34720"/>
    </linearGradient>
  </defs>

  <!-- Ambient Golden Aura -->
  <circle cx="250" cy="175" r="210" fill="url(#ambient-glow)"/>

  <!-- Clay Diya Base -->
  <g id="diya-base">
    <ellipse cx="250" cy="400" rx="90" ry="20" fill="#301005" opacity="0.6"/>
    <path d="M 210 375 L 200 400 L 300 400 L 290 375 Z" fill="#7A2D12"/>
    <!-- Body -->
    <path d="M 90 260 C 110 375, 210 410, 250 410 C 290 410, 390 375, 410 260 C 370 290, 290 300, 250 300 C 210 300, 130 290, 90 260 Z" fill="url(#clay-base)"/>
    <!-- Rim -->
    <path d="M 90 260 C 130 285, 200 295, 250 295 C 300 295, 370 285, 410 260 C 370 240, 300 230, 250 230 C 200 230, 130 240, 90 260 Z" fill="url(#clay-rim)"/>
    <ellipse cx="250" cy="265" rx="130" ry="27" fill="#58210D"/>
    <!-- Wick -->
    <path d="M 245 260 C 245 230, 250 215, 250 205 C 250 215, 255 230, 255 260 Z" fill="#261C14" stroke="#120B06" stroke-width="4"/>
  </g>

  <!-- Sacred Golden Flame -->
  <g id="diya-flame" filter="url(#flame-glow)">
    <path d="M 250 50 C 215 120, 185 160, 200 200 C 215 235, 285 235, 300 200 C 315 160, 285 120, 250 50 Z" fill="url(#flame-outer)"/>
    <path d="M 250 100 C 230 135, 215 160, 225 190 C 235 210, 265 210, 275 190 C 285 160, 270 135, 250 100 Z" fill="url(#flame-inner)"/>
    <ellipse cx="250" cy="185" rx="12" ry="20" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>