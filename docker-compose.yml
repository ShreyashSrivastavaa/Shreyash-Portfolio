# ═══════════════════════════════════════════════════════════
# Docker Compose — Full Stack Portfolio
# Frontend (Next.js) + Backend (FastAPI) + MongoDB
# ═══════════════════════════════════════════════════════════

version: '3.8'

services:
  # ——— Frontend (Next.js) ———
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws
    depends_on:
      - backend
    networks:
      - portfolio

  # ——— Backend (FastAPI) ———
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongo:27017/portfolio
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - mongo
    networks:
      - portfolio
    restart: unless-stopped

  # ——— MongoDB ———
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - portfolio
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  portfolio:
    driver: bridge
